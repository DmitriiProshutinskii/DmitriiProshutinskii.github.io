name: GitHub Pages
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build static portfolio
        run: npm run build:site
      - name: Verify pages and local links
        run: node scripts/check-site.mjs
      - name: Check out published branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
      - name: Publish to existing GitHub Pages branch
        working-directory: published
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r --ignore-unmatch .
          cp -R ../build/. .
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "Publish portfolio ${GITHUB_SHA}"
            git push origin HEAD:gh-pages
          fi
